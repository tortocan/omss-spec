openapi: 3.1.0
info:
    title: Open Media Streaming Specification (OMSS)
    description: |
        OMSS (Open Media Streaming Specification) v1.2 — a unified REST API
        standard for streaming media backends, enabling any frontend to work with
        any OMSS-compliant backend via standardized TMDB-keyed endpoints for
        streaming sources and subtitles.

        **Changes vs v1.1:**
        - `Source.audioTracks` is an array of `AudioTrack` objects
          `{language, label}` (v1.1 described `string[]`). This aligns the schema
          with the `@omss/sdk`, which already types audio tracks as objects, so
          frontends can SELECT a track by its ISO-639 language code, not only
          display a name.
        - Optional backend extensions are catalogued under `extensions/` (see the
          Scrobble extension) — additive to the core surface below.

        **Key Features:**
        - Standardized endpoints for movies and TV episodes
        - Multi-language and multi-quality source support
        - Subtitle support with multiple formats
        - Diagnostic reporting for partial scrapes

        **OMSS SDK:** [github.com/omss-spec/sdk](https://github.com/omss-spec/sdk)
    version: 1.2.0
    license:
        name: MIT License
        url: https://github.com/omss-spec/omss-spec/blob/main/LICENSE
    contact:
        name: OMSS Community
        url: https://github.com/omss-spec/omss-spec

servers:
    - url: http://localhost:{port}
      description: Development server (localhost only)
      variables:
          port:
              default: '3000'
              description: Port
    - url: https://{domain}
      description: Production server
      variables:
          domain:
              default: 'api.example.com'
              description: Your hosted OMSS server

tags:
    - name: Home
      description: General backend information and capabilities
    - name: Movies
      description: Movie streaming sources
    - name: TV
      description: TV episode streaming sources
    - name: Refresh
      description: Refresh cached source responses
    - name: Scrobble
      description: >
        Optional backend extension. Report playback progress and read back resume
        points / watched history (local, no third party).
    - name: Resume
      description: Optional backend extension. The backend's continue-watching decision for a title.

paths:
  /:
    get:
      summary: Root OMSS backend information
      description: General information about the backend implementation and available media.
      operationId: getRoot
      tags: [Home]
      responses:
        '200':
          description: Root backend information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1:
    get:
      summary: Versioned root OMSS backend information
      description: General information about the OMSS v1 backend implementation and available media.
      operationId: getRootV1
      tags: [Home]
      responses:
        '200':
          description: Versioned root backend information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/movies/{id}:
    get:
      summary: Movie sources
      description: Retrieve movie streaming sources by TMDB movie ID.
      operationId: getMovieSources
      tags: [Movies]
      parameters:
        - $ref: '#/components/parameters/MovieId'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: Movie sources and subtitles successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/tv/{id}/seasons/{s}/episodes/{e}:
    get:
      summary: TV episode sources
      description: Retrieve TV episode streaming sources by TMDB series ID, season, and episode.
      operationId: getTvEpisodeSources
      tags: [TV]
      parameters:
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/SeasonNumber'
        - $ref: '#/components/parameters/EpisodeNumber'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: TV episode sources and subtitles successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/refresh/{id}:
    post:
      summary: Refresh cached response
      description: >
        Unified endpoint to refresh a response by its identifier, invalidating
        the cached entry so that the next media request triggers a fresh scrape.
      operationId: refreshResponse
      tags: [Refresh]
      parameters:
        - $ref: '#/components/parameters/ResponseId'
      responses:
        '200':
          description: Refresh request accepted and cache invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---- Scrobble extension (optional) --------------------------------------------------------
  # Local playback tracking a backend MAY expose for resume / continue-watching and watched
  # history. Additive to the core surface above; a backend that omits it is still compliant.
  /scrobble:
    post:
      summary: Report playback
      description: >
        Report a playback event for one title and upsert its stored state. `action` is `start`,
        `pause`, or `stop`; `progress` is percent complete (0-100). A `stop` at or above 80% marks the
        title watched (the flag latches on and never clears). The body MAY be sent as
        `application/json` or `text/plain` (the latter lets a browser `navigator.sendBeacon` leave-time
        save avoid a CORS preflight).
      operationId: reportScrobble
      tags: [Scrobble]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrobbleRequest'
          text/plain:
            schema:
              $ref: '#/components/schemas/ScrobbleRequest'
      responses:
        '200':
          description: The upserted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Clear all scrobble state
      description: "Remove every stored scrobble row. Idempotent - clearing an empty store returns `deleted: 0`."
      operationId: clearScrobbles
      tags: [Scrobble]
      responses:
        '200':
          description: Count of rows removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /scrobble/playback:
    get:
      summary: Resume list (continue watching)
      description: Titles with a mid-range stored position (2-95%), most-recently-played first.
      operationId: getScrobblePlayback
      tags: [Scrobble]
      parameters:
        - $ref: '#/components/parameters/MediaTypeFilter'
      responses:
        '200':
          description: In-progress titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobblePlaybackResponse'

  /scrobble/history:
    get:
      summary: Watched history
      description: Watched titles, newest first, with DataTables-style paging counters.
      operationId: getScrobbleHistory
      tags: [Scrobble]
      parameters:
        - $ref: '#/components/parameters/MediaTypeFilter'
        - name: start
          in: query
          required: false
          description: Zero-based offset of the first row to return.
          schema: { type: integer, minimum: 0 }
        - name: length
          in: query
          required: false
          description: Page size (clamped 1-500).
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Watched titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleHistoryResponse'

  /scrobble/show/{tmdbId}:
    get:
      summary: A show's scrobbled episodes
      description: Every scrobbled episode of one show (by the show's TMDB id), ordered by season then episode.
      operationId: getScrobbleShow
      tags: [Scrobble]
      parameters:
        - $ref: '#/components/parameters/ShowTmdbId'
      responses:
        '200':
          description: The show's episodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleShowResponse'

  /scrobble/resume/{type}/{tmdbId}:
    get:
      summary: Resume target (continue-watching decision)
      description: >
        The backend's decision of what - and where - to resume for a title, so a client asks instead
        of re-deriving it. For a movie: resumable only while a mid-range position is stored. For a
        show: the in-progress episode, else the next servable episode after the furthest watched
        (`next_up`), else that furthest episode (`rewatch`). `resumable: false` means offer Play from
        the start.
      operationId: getResumeTarget
      tags: [Resume]
      parameters:
        - name: type
          in: path
          required: true
          description: Media type to resume.
          schema: { type: string, enum: [movie, tv] }
        - $ref: '#/components/parameters/TmdbIdPath'
      responses:
        '200':
          description: The resume target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeTarget'
        '400':
          $ref: '#/components/responses/BadRequest'

  /scrobble/{mediaKey}:
    get:
      summary: Stored state for one title
      description: The stored scrobble row for a media key (`m{tmdb}` or `e{tmdb}-{s}-{e}`).
      operationId: getScrobbleState
      tags: [Scrobble]
      parameters:
        - $ref: '#/components/parameters/MediaKey'
      responses:
        '200':
          description: The stored row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrobbleState'
        '404':
          description: Never scrobbled.
    delete:
      summary: Remove one title's state
      description: Remove the stored row for one media key.
      operationId: deleteScrobble
      tags: [Scrobble]
      parameters:
        - $ref: '#/components/parameters/MediaKey'
      responses:
        '204':
          description: Removed.
        '404':
          description: No such row.

components:
  parameters:
    MovieId:
      name: id
      in: path
      required: true
      description: TMDB movie ID, numeric characters only, treated as a string.
      schema:
        type: string
        pattern: '^[0-9]+$'
        maxLength: 20

    SeriesId:
      name: id
      in: path
      required: true
      description: TMDB series ID, numeric characters only, treated as a string.
      schema:
        type: string
        pattern: '^[0-9]+$'
        maxLength: 20

    SeasonNumber:
      name: s
      in: path
      required: true
      description: Season number (non-negative integer).
      schema:
        type: integer
        minimum: 0
        maximum: 99

    EpisodeNumber:
      name: e
      in: path
      required: true
      description: Episode number (positive integer).
      schema:
        type: integer
        minimum: 1
        maximum: 9999

    ResponseId:
      name: id
      in: path
      required: true
      description: >
        Response identifier used by the refresh endpoint. Alphanumeric with
        hyphens/underscores, max 128 characters.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
        maxLength: 128

    Platform:
      name: platform
      in: query
      required: false
      description: >
        Target platform for source optimization. For "web" the url fields must
        be directly usable in browsers without additional headers or CORS
        handling. For "native" the url fields are upstream URLs and headers are
        returned to be used by native players. Default is "web".
      schema:
        type: string
        enum:
          - web
          - native

    Provider:
      name: provider
      in: query
      required: false
      description: >
        Specific provider ID to fetch sources from. The response structure
        remains the same but only sources from this provider are returned. If
        the provider is unknown, a PROVIDER_NOT_FOUND error is returned.
      schema:
        type: string

    Filter:
      name: filter
      in: query
      required: false
      description: >
        Filter expression applied to the sources array (not subtitles) after
        retrieval and before the response is returned. Syntax:
        "condition[;condition...]" where ";" acts as logical AND. Supported
        operators: "==", "!=", "=in=", "=out=". The wildcard "*" MAY be used in
        values. Backends MUST support filtering on quality, type, streamable,
        provider.id, provider.name, audioTracks, and format.
      schema:
        type: string

    # Scrobble extension parameters
    MediaKey:
      name: mediaKey
      in: path
      required: true
      description: Media key - `m{tmdbId}` (movie) or `e{showTmdbId}-{season}-{episode}` (episode).
      schema: { type: string, pattern: '^(m[0-9]+|e[0-9]+-[0-9]+-[0-9]+)$', maxLength: 64 }
    TmdbIdPath:
      name: tmdbId
      in: path
      required: true
      description: TMDB id (movie id, or show id for a tv resume).
      schema: { type: integer, minimum: 1 }
    ShowTmdbId:
      name: tmdbId
      in: path
      required: true
      description: TMDB series id of the show.
      schema: { type: integer, minimum: 1 }
    MediaTypeFilter:
      name: type
      in: query
      required: false
      description: Narrow to one media type.
      schema: { type: string, enum: [movie, episode] }

  responses:
    BadRequest:
      description: >
        Bad request due to invalid or missing parameters, or invalid TMDB ID
        format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: >
        Resource not found, including media that does not exist for the given
        TMDB ID or media that exists but has no available sources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotAcceptable:
      description: >
        The requested Accept header is not supported. OMSS supports JSON
        responses only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnsupportedMediaType:
      description: Unsupported Content-Type in the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HomeResponse:
      type: object
      description: Root information about the OMSS backend and available media.
      required:
        - name
        - version
        - status
        - endpoints
        - spec
        - media
        - providers
      properties:
        name:
          type: string
          description: Implementation name.
        version:
          type: string
          description: Semantic version of the OMSS implementation.
        status:
          type: string
          description: API status.
          enum:
            - operational
            - degraded
            - down
        spec:
          type: string
          description: Specification identifier; MUST be "omss" for OMSS implementations.
          enum:
            - omss
        note:
          type: string
          description: Optional message, description, or disclaimer provided by the backend.
        endpoints:
          type: object
          description: Functions mapped to paths.
          required:
            - movie
            - tv
          properties:
            movie:
              type: string
              description: >
                Path to the movie endpoint. MUST contain the "{id}" placeholder
                where the frontend will insert the TMDB movie ID.
            tv:
              type: string
              description: >
                Path to the TV show endpoint. MUST contain the "{id}", "{s}",
                and "{e}" placeholders where the frontend will insert the TMDB
                series ID, season, and episode respectively.
        media:
          $ref: '#/components/schemas/MediaOverview'
        providers:
          type: array
          description: List of providers this backend exposes.
          items:
            $ref: '#/components/schemas/Provider'

    MediaOverview:
      type: object
      description: Overview of media availability.
      required:
        - movies
        - tv
      properties:
        movies:
          description: >
            List of TMDB movie IDs available in this backend, or "*" if all
            movies are supported.
          oneOf:
            - type: array
              items:
                type: integer
            - type: string
              enum:
                - '*'
        tv:
          description: >
            List of TMDB TV series IDs with available seasons and episodes, or
            "*" if all TV series are supported.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/TvAvailability'
            - type: string
              enum:
                - '*'

    TvAvailability:
      type: object
      description: Availability information for a single TV series.
      required:
        - id
        - seasons
      properties:
        id:
          type: integer
          description: TMDB series ID.
        seasons:
          type: array
          description: List of seasons with available episodes.
          items:
            type: object
            required:
              - season
              - episodes
            properties:
              season:
                type: integer
                description: Season number.
              episodes:
                type: array
                description: List of available episode numbers in this season.
                items:
                  type: integer

    Provider:
      type: object
      description: Provider metadata including capabilities.
      required:
        - id
        - name
        - capabilities
      properties:
        id:
          type: string
          description: Unique, URL-safe provider identifier.
        name:
          type: string
          description: Human-readable provider name.
        capabilities:
          type: array
          description: >
            List of media types the provider supports. Any combination of
            "movies", "tv", and/or "subtitles".
          items:
            type: string
            enum:
              - movies
              - tv
              - subtitles

    ProviderRef:
      type: object
      description: Provider reference information included in sources and subtitles.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique provider identifier.
        name:
          type: string
          description: Human-readable provider name.

    SourcesResponse:
      type: object
      description: >
        Success response for movie and TV episode endpoints, containing sources,
        subtitles, and diagnostics.
      required:
        - id
        - sources
        - subtitles
        - diagnostics
      properties:
        id:
          type: string
          format: uuid
          description: Unique response identifier (e.g. UUID v4).
        expiresAt:
          type: string
          format: date-time
          description: >
            Optional ISO 8601 timestamp when sources expire (for signed or
            temporary URLs).
        sources:
          type: array
          description: Array of streaming source objects. Must contain at least one element if any sources are available.
          items:
            $ref: '#/components/schemas/Source'
        subtitles:
          type: array
          description: Array of subtitle objects. May be empty.
          items:
            $ref: '#/components/schemas/Subtitle'
        diagnostics:
          type: array
          description: >
            Non-fatal warnings or errors about data quality, inference, or
            provider issues. May be empty.
          items:
            $ref: '#/components/schemas/Diagnostic'

    Source:
      type: object
      description: Streaming source with quality and technical metadata.
      required:
        - id
        - url
        - streamable
        - type
        - quality
        - audioTracks
        - provider
      properties:
        id:
          type: string
          format: uuid
          description: Unique source identifier (e.g. UUID v4).
        url:
          type: string
          format: uri
          description: >
            For platform=web: URL directly usable in HTML5 video players without
            CORS issues. For platform=native: upstream URL from the provider,
            possibly requiring CORS handling or custom headers (provided in
            headers).
        headers:
          type: object
          description: >
            Present only for platform=native. Key-value pairs of HTTP and
            non-standard HTTP headers to include when accessing the url.
          additionalProperties:
            type: string
        streamable:
          type: boolean
          description: >
            Indicates if the source is streamable (true) or a direct download
            link (false). Download links MUST NOT be used as streaming sources.
        type:
          type: string
          description: Source type.
          enum:
            - hls   # HTTP Live Streaming (M3U8)
            - mp4   # MP4 file
            - mkv   # MKV file
            - dash  # MPEG-DASH (.mpd)
        quality:
          type: string
          description: >
            Video quality. Should be inferred from resolution, bitrate, filename,
            or manifest information; use "Auto" when unknown.
          enum:
            - '8K'
            - '4K'
            - QHD
            - FHD
            - HD
            - SD
            - Auto
        audioTracks:
          type: array
          description: >
            Available audio tracks. Each entry carries an ISO 639 language code
            and a human-readable label, so frontends can both display and
            programmatically select a track by language. (Changed from string[]
            in v1.1 to match the @omss/sdk.)
          items:
            $ref: '#/components/schemas/AudioTrack'
        provider:
          $ref: '#/components/schemas/ProviderRef'

    AudioTrack:
      type: object
      description: One audio track of a source.
      required:
        - language
        - label
      properties:
        language:
          type: string
          description: >
            ISO 639 language code (e.g. "eng", "jpn"). Use "und" when the
            language cannot be determined.
        label:
          type: string
          description: >
            Human-readable track name (e.g. "English"). Use "Original" when the
            language cannot be determined.

    Subtitle:
      type: object
      description: Subtitle or caption track.
      required:
        - id
        - url
        - label
        - format
        - provider
      properties:
        id:
          type: string
          format: uuid
          description: Unique subtitle identifier (e.g. UUID v4).
        url:
          type: string
          format: uri
          description: >
            For platform=web: direct subtitle URL usable in HTML5 track elements
            without CORS issues. For platform=native: upstream subtitle URL from
            the provider, possibly requiring CORS handling or custom headers
            (provided in headers).
        headers:
          type: object
          description: >
            Present only for platform=native. Key-value pairs of HTTP and
            non-standard HTTP headers to include when accessing the url.
          additionalProperties:
            type: string
        label:
          type: string
          description: >
            Human-readable language name for the subtitle track. Use "Unknown"
            when the language cannot be determined.
        format:
          type: string
          description: Subtitle format.
          enum:
            - vtt  # WebVTT (preferred for web; default)
            - srt  # SubRip
        provider:
          $ref: '#/components/schemas/ProviderRef'

    Diagnostic:
      type: object
      description: Non-response-fatal warning or error encountered during scraping.
      required:
        - code
        - message
        - source
        - severity
      properties:
        code:
          type: string
          description: Machine-readable warning/error code.
          enum:
            - PROVIDER_ERROR
            - PARTIAL_SCRAPE
        message:
          type: string
          description: Human-readable description of the issue.
        source:
          type: string
          description: >
            Identifier of the source of the issue (e.g. provider ID). Empty
            string means the warning applies to the entire response.
        severity:
          type: string
          description: Warning/error severity.
          enum:
            - warning
            - error

    RefreshResponse:
      type: object
      description: Response object for the refresh endpoint.
      required:
        - status
      properties:
        status:
          type: string
          description: Refresh status string; MUST be "OK" on success.
          enum:
            - OK

    ErrorResponse:
      type: object
      description: Standard error response format for all non-2xx responses.
      required:
        - error
        - traceId
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        traceId:
          type: string
          description: Unique identifier for error tracking and debugging.

    ErrorObject:
      type: object
      description: Error details container.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - INVALID_TMDB_ID
            - INVALID_PARAMETER
            - MISSING_PARAMETER
            - INVALID_SEASON
            - INVALID_EPISODE
            - INVALID_RESPONSE_ID
            - PROVIDER_NOT_FOUND
            - RESPONSE_ID_NOT_FOUND
            - NO_SOURCES_AVAILABLE
            - ENDPOINT_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INTERNAL_ERROR
            - UNSUPPORTED_MEDIA_TYPE
            - NOT_ACCEPTABLE
        message:
          type: string
          description: Human-readable error description.
        details:
          description: >
            Optional additional context about the error. Frontends should not
            display this field directly.

    # ---- Scrobble extension schemas -----------------------------------------------------------
    ScrobbleMediaType:
      type: string
      description: Media kind a scrobble row represents.
      enum: [movie, episode]

    ScrobbleStatus:
      type: string
      description: The last reported playback action.
      enum: [started, paused, stopped]

    ScrobbleAction:
      type: string
      description: A reported playback event.
      enum: [start, pause, stop]

    ScrobbleRequest:
      type: object
      description: Body of `POST /scrobble`. `season`/`episode` are required for an episode, ignored for a movie.
      required: [mediaType, tmdbId, progress, action]
      properties:
        mediaType: { $ref: '#/components/schemas/ScrobbleMediaType' }
        tmdbId:
          type: integer
          description: TMDB id - the movie id, or the SHOW id for an episode.
          minimum: 1
        season: { type: integer, minimum: 0, description: Season number (episodes only). }
        episode: { type: integer, minimum: 0, description: Episode number (episodes only). }
        progress:
          type: number
          description: Percent complete, 0-100.
          minimum: 0
          maximum: 100
        action: { $ref: '#/components/schemas/ScrobbleAction' }
        title:
          type: string
          description: Optional display title (movie title or show title), stored denormalized so clients needn't re-resolve it.

    ScrobbleState:
      type: object
      description: The stored playback state for one title.
      required: [mediaKey, mediaType, tmdbId, season, episode, progress, status, watched, watchedAt, updatedAt]
      properties:
        mediaKey: { type: string, description: '`m{tmdb}` | `e{tmdb}-{s}-{e}`.' }
        mediaType: { $ref: '#/components/schemas/ScrobbleMediaType' }
        tmdbId: { type: integer, description: Movie id, or the show id for an episode. }
        season: { type: integer }
        episode: { type: integer }
        progress: { type: number, description: Percent complete, 0-100. }
        status: { $ref: '#/components/schemas/ScrobbleStatus' }
        watched: { type: boolean, description: True once stopped at >=80% (latches on). }
        watchedAt: { type: integer, description: Unix seconds; 0 if never watched. }
        updatedAt: { type: integer, description: Unix seconds of the last scrobble. }
        title: { type: [string, 'null'], description: Denormalized display title; null if unknown. }

    ScrobbleAck:
      type: object
      description: Acknowledgement returned by `POST /scrobble` (the upserted row's live state).
      required: [mediaKey, status, progress, watched, watchedAt, updatedAt]
      properties:
        mediaKey: { type: string }
        status: { $ref: '#/components/schemas/ScrobbleStatus' }
        progress: { type: number }
        watched: { type: boolean }
        watchedAt: { type: integer }
        updatedAt: { type: integer }

    ScrobblePlaybackResponse:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/ScrobbleState' }

    ScrobbleShowResponse:
      type: object
      required: [count, data]
      properties:
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/ScrobbleState' }

    ScrobbleHistoryResponse:
      type: object
      required: [recordsTotal, recordsFiltered, data]
      properties:
        recordsTotal: { type: integer, description: Total watched rows. }
        recordsFiltered: { type: integer, description: Rows matching the filter. }
        data:
          type: array
          items: { $ref: '#/components/schemas/ScrobbleState' }

    ResumeReason:
      type: string
      description: Why this resume target was chosen.
      enum: [in_progress, next_up, rewatch, none]

    ResumeTarget:
      type: object
      description: The backend's continue-watching decision for a title.
      required: [resumable, mediaType, tmdbId, season, episode, progress, reason]
      properties:
        resumable: { type: boolean, description: False means the client should offer Play from the start. }
        mediaType: { $ref: '#/components/schemas/ScrobbleMediaType' }
        tmdbId: { type: integer }
        season: { type: integer, description: 0 for a movie. }
        episode: { type: integer, description: 0 for a movie. }
        progress: { type: number, description: 0-100 seek position (0 = start of that episode). }
        title: { type: [string, 'null'] }
        reason: { $ref: '#/components/schemas/ResumeReason' }

    ClearResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: Number of rows removed. }
